[build]
  publish = "public"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"
  external_node_modules = ["@netlify/blobs", "@anthropic-ai/sdk"]

[[redirects]]
  from = "/aidoctor-api/analyze"
  to = "/.netlify/functions/analyze"
  status = 200

[[redirects]]
  from = "/"
  to = "https://nigmatullin.pro/aidoctor/"
  status = 302

[[redirects]]
  from = "/index.html"
  to = "https://nigmatullin.pro/aidoctor/"
  status = 302

[[redirects]]
  from = "/pro"
  to = "https://nigmatullin.pro/aidoctor/"
  status = 302

[[redirects]]
  from = "/pro.html"
  to = "https://nigmatullin.pro/aidoctor/"
  status = 302

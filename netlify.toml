[build]
  publish = "public"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[[redirects]]
  from = "/aidoctor-api/analyze"
  to = "/.netlify/functions/analyze"
  status = 200

[[redirects]]
  from = "/"
  to = "/free/"
  status = 302

[[redirects]]
  from = "/index.html"
  to = "/free/"
  status = 302

[[redirects]]
  from = "/pro"
  to = "/free/"
  status = 302

[[redirects]]
  from = "/pro.html"
  to = "/free/"
  status = 302
